name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test with coverage
        run: pytest --cov=dicomvolumeqc --cov-report=term-missing --cov-fail-under=85

  integration:
    name: end-to-end pipeline
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run full pipeline
        run: dvqc run-all --out data/fixtures --reports reports --export export
      - name: Verify manifest
        run: dvqc verify --export export
      - name: Upload reports and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvqc-artifacts
          path: |
            reports/
            export/manifest.json
          if-no-files-found: warn
