[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicomvolumeqc"
version = "0.1.0"
description = "Reproducible DICOM-to-ML 3D volume preparation with QC, de-identification, and a checksummed manifest"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DicomVolumeQC contributors" }]
dependencies = [
    "numpy>=1.26",
    "pydicom>=2.4",
    "SimpleITK>=2.3",
    "scipy>=1.11",
    "pandas>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
dvqc = "dicomvolumeqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:pydicom.*",
]

[tool.coverage.run]
source = ["dicomvolumeqc"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
